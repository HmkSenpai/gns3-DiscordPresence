name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gns3-presence-windows
            binary: gns3-presence.exe
          - os: ubuntu-latest
            artifact: gns3-presence-linux
            binary: gns3-presence
          - os: macos-latest
            artifact: gns3-presence-macos
            binary: gns3-presence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypresence tomli pystray pillow

      - name: Build
        run: python tools/package_release.py

      - name: Smoke test
        run: ./dist/${{ matrix.binary }} --check || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.artifact }}.*
          if-no-files-found: error
