name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gns3-presence-windows
            binary: gns3-presence.exe
          - os: ubuntu-latest
            artifact: gns3-presence-linux
            binary: gns3-presence
          - os: macos-latest
            artifact: gns3-presence-macos
            binary: gns3-presence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypresence tomli pystray pillow

      - name: Build the executable and the archive
        run: python tools/package_release.py

      - name: Checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist/${{ matrix.binary }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.binary }}" | Out-File -Encoding ascii "dist/${{ matrix.binary }}.sha256"

      - name: Checksum (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist && sha256sum "${{ matrix.binary }}" > "${{ matrix.binary }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
