name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: gns3-presence-windows
            binary: gns3-presence.exe
          - os: ubuntu-latest
            artifact: gns3-presence-linux
            binary: gns3-presence
          - os: macos-latest
            artifact: gns3-presence-macos
            binary: gns3-presence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pypresence tomli

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name gns3-presence \
            --collect-all pypresence \
            entrypoint.py
          mv dist/gns3-presence dist/${{ matrix.binary }}
          chmod +x dist/${{ matrix.binary }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name gns3-presence ^
            --collect-all pypresence ^
            entrypoint.py
          copy dist\gns3-presence.exe dist\${{ matrix.binary }} /Y

      - name: Checksum
        working-directory: dist
        run: sha256sum ${{ matrix.binary }} > ${{ matrix.binary }}.sha256 || shasum -a 256 ${{ matrix.binary }} > ${{ matrix.binary }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/${{ matrix.binary }}, config.example.toml, README.md, assets -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist ${{ matrix.binary }} ${{ matrix.binary }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.binary }}
            dist/${{ matrix.binary }}.sha256
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
