[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gns3-discordpresence"
version = "1.0.0"
description = "Discord Rich Presence companion for GNS3"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hinmaka" }]
keywords = ["gns3", "discord", "rich-presence", "networking", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: System :: Networking",
]
dependencies = [
    "pypresence>=4.3.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
tray = ["pystray>=0.19.5", "pillow>=10.0.0"]
dev = ["pyinstaller>=6.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/Hinmaka/gns3-DiscordPresence"
Issues = "https://github.com/Hinmaka/gns3-DiscordPresence/issues"

[project.scripts]
gns3-presence = "gns3presence.cli:main"

[tool.setuptools]
packages = ["gns3presence"]

[tool.ruff]
line-length = 100
# The package supports Python 3.9, so the typing.Dict / Optional style is kept.
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::ResourceWarning"]
